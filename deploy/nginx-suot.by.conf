# deploy/nginx-suot.by.conf — виртуальный хост Nginx (CWP: вставить в vhost suot.by)
# Правила хоста из redirects.csv: http → https и www → без www одним 301.

server {
    listen 80;
    server_name suot.by www.suot.by;
    return 301 https://suot.by$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.suot.by;
    # ssl_certificate / ssl_certificate_key — как у текущего сайта (CWP AutoSSL)
    return 301 https://suot.by$request_uri;
}

server {
    listen 443 ssl http2;
    server_name suot.by;
    # ssl_certificate / ssl_certificate_key — как у текущего сайта

    client_max_body_size 12m;   # вложения заявок до 10 МБ

    access_log /var/log/nginx/suot.by.access.log;
    error_log  /var/log/nginx/suot.by.error.log;

    # Статика (собирается collectstatic, отдаётся с долгим кэшем)
    location /static/ {
        alias /srv/suotby/app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Медиа: загруженные картинки, образцы документов
    location /media/ {
        alias /srv/suotby/media/;
        expires 7d;
        # 🔐 ничего исполняемого из медиа
        location ~* \.(php|py|pl|sh|cgi|html?)$ { deny all; }
    }

    # 💡 Старые ссылки на картинки Joomla (/images/…) из текстов и из внешних сайтов —
    # отдаём перенесённые файлы без переписывания адресов
    location /images/ {
        alias /srv/suotby/media/legacy/images/;
        expires 30d;
        location ~* \.(php|py|pl|sh|cgi|html?)$ { deny all; }
    }

    # 🔐 вложения заявок — только через Django (проверка прав), напрямую не отдаются
    location /private_media/ { deny all; }

    # Старые служебные файлы Joomla — сразу 410, не нагружая приложение
    location ~* ^/(administrator|components|modules|plugins|templates|libraries|cache|tmp)/ { return 410; }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
