<!-- шапка: логотип, меню, кнопка -->
<div style="background:#F6F4EF;border-bottom:1px solid #DDD9CE">
<div style="max-width:1200px;margin:0 auto;padding:18px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px">

<a href="Kontakty.dc.html" style="background:#C2410C;color:#fff;font-weight:600;font-size:16px;padding:13px 22px;border-radius:10px;text-decoration:none">Получить расчёт</a>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["","uslugi","suot","ceny","poleznoe","faq","o-nas","kontakty"],"default":""},"$preview":{"width":1360,"height":150}}'>
class Component extends DCLogic {
  // Пункты меню повторяют структуру старого сайта (_navigation.yaml),
  // но сгруппированы короче: «Полезное» ведёт на шаблон раздела материалов.
  renderVals() {
    const active = this.props.active ?? '';
    const base = 'color:#14212B;text-decoration:none;padding:6px 0;border-bottom:2px solid transparent';
    const on = 'color:#8A2F08;text-decoration:none;padding:6px 0;border-bottom:2px solid #C2410C';
    const list = [
      { key: 'uslugi', label: 'Услуги', href: 'Uslugi.dc.html' },
      { key: 'suot', label: 'Разработка СУОТ', href: 'Usluga.dc.html' },
      { key: 'ceny', label: 'Цены', href: 'Ceny.dc.html' },
      { key: 'poleznoe', label: 'Полезное', href: 'Razdel.dc.html' },
      { key: 'faq', label: 'Вопрос-ответ', href: 'VoprosOtvet.dc.html' },
      { key: 'o-nas', label: 'О нас', href: 'ONas.dc.html' },
      { key: 'kontakty', label: 'Контакты', href: 'Kontakty.dc.html' }
    ];
    return { items: list.map((x) => ({ ...x, style: x.key === active ? on : base })) };
  }
}
</script>

</html>
